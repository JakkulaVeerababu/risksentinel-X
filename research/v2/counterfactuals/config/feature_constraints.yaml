version: counterfactual-config-v1
features:
  immutable:
    - transaction_id
    - customer_id
    - card_id
    - device_id
    - is_fraud
    - TransactionDT
  semi_mutable:
    - TransactionAmt
    - ProductCD
    - P_emaildomain
  actionable_but_sensitive:
    - card1
    - card2
    - addr1
  derived:
    - velocity_1hr
    - velocity_24hr
    - amt_deviation_historical
    - device_sharing_count
anonymized_ieee_cis:
  - V1..V339
  - C1..C14
  - D1..D15
  - M1..M9
safety_rules:
  suppress_exact_numeric_change: true
  block_policy_thresholds: true
  mask_anonymized_semantics: true
