services:
  - type: web
    name: risksentinel-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: AGENT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TIMEOUT_MS
        value: "10000"
      - key: GEMINI_RETRY_ATTEMPTS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: STRIPE_API_KEY
        sync: false
